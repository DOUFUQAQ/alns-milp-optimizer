name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unittest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies only
        run: |
          python -m pip install --upgrade pip
          # 故意只装核心依赖：tqdm / matplotlib / seaborn / gurobipy / osmnx 都不装，
          # 用来验证“可选依赖缺失时核心算法与测试仍然可用”
          pip install numpy pandas

      - name: Byte-compile everything
        run: python -m compileall -q src tests tools experiments main.py conftest.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: ruff (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true          # 存量代码尚未完全 lint-clean，仅作提示
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        run: ruff check src tests tools --output-format=github || true
